<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livebox TV Card – test</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: Roboto, system-ui, sans-serif; background: #f0f0f0; color: var(--primary-text-color); --primary-text-color:#1c1c1c; --secondary-text-color:#727272; --secondary-background-color:#eef0f3; --divider-color:#e0e0e0; }
  body.dark { background: #111; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --secondary-background-color:#2a2c30; --divider-color:#333; --ha-card-background:#1c1c1e; }
  body.dark a { color: #8ab4f8; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; }
  .bar input { width: 3.5em; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .col { width: 420px; max-width: 100%; }
  /* ?apercu : mise en page de la capture du README */
  body.apercu { padding: 24px; }
  body.apercu.dark { background: #0f1012; }
  body.apercu.light { background: #eef0f3; }
  body.apercu > .bar, body.apercu > p, body.apercu #log { display: none; }
  body.apercu .wrap { flex-wrap: nowrap; }
  body.apercu .col { width: 400px; }
  #log { font: 12px monospace; white-space: pre-wrap; background: #222; color: #9f9; padding: 8px; border-radius: 8px; max-height: 200px; overflow: auto; }
</style>
<script>
  // stubs minimalistes des éléments HA (la @font-face doit être déclarée dans le document)
  document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">');
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() { this.style.cssText += ";display:block;background:var(--ha-card-background,#fff);border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden"; }
  });
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    constructor() { super(); this.attachShadow({ mode: "open" }); }
    attributeChangedCallback() {
      const n = (this.getAttribute("icon") || "").replace("mdi:", "");
      this.shadowRoot.innerHTML = `<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"><i class="mdi mdi-${n}" style="font-size:var(--mdc-icon-size,24px);line-height:1;display:block"></i>`;
    }
  });
</script>
<script type="module" src="../dist/livebox-tv-card.js"></script>
</head>
<body>
<p><strong>Démo de Livebox TV Card</strong> : décodeurs simulés, aucune commande n'est envoyée.
  Les appels de services que la carte ferait dans Home Assistant s'affichent en bas de la page.
  <a href="https://github.com/aubierr/ha-livebox-card">Dépôt GitHub</a></p>
<div class="bar">
  <label>Nombre de décodeurs <input id="count" type="number" min="1" max="8" value="1"></label>
  <button onclick="document.body.classList.toggle('dark')">Thème clair/sombre</button>
  <button onclick="toggleAll()">Allumer/éteindre tous (simulé)</button>
</div>
<div class="wrap" id="cards"></div>
<p>Appels de services :</p>
<div id="log"></div>
<script>
  const params = new URLSearchParams(location.search);
  // ?apercu=sombre (défaut) ou ?apercu=clair : mise en page des captures du README (2 décodeurs)
  const apercu = params.get("apercu");
  if (apercu !== null) document.body.classList.add("apercu", apercu === "clair" ? "light" : "dark");
  // ?n=3 : nombre de décodeurs ; ?veille : décodeurs éteints au départ
  const MAX = 8;
  const veille = params.has("veille");

  // extrait de la vraie liste Orange France de l'intégration (const_france.py)
  const list = ["0. GUIDE TV", "1. TF1", "2. FRANCE 2", "3. FRANCE 3", "4. FRANCE 4", "5. FRANCE 5", "6. M6", "7. ARTE", "8. LCP/PS", "9. W9", "10. TMC", "11. TFX", "12. GULLI", "13. BFM TV", "14. CNEWS", "15. LCI", "16. FRANCEINFO:", "17. CSTAR", "18. T18", "19. NOVO19", "20. TF1 SERIES FILMS", "21. LA CHAINE L'EQUIPE", "22. 6TER", "23. RMC STORY", "24. RMC DECOUVERTE", "25. RMC LIFE", "33. TV5MONDE", "34. RTL9", "35. TEVA", "36. PARIS PREMIERE", "37. TV BREIZH", "40. CANAL+", "50. BEIN SPORTS 1", "51. BEIN SPORTS 2", "115. MIEUX", "120. ANIMAUX", "901. TF1 4K"];
  const START = ["7. ARTE", "1. TF1", "6. M6", "2. FRANCE 2", "40. CANAL+", "12. GULLI", "13. BFM TV", "5. FRANCE 5"];

  const log = (t) => { const l = document.getElementById("log"); l.textContent = t + "\n" + l.textContent; };
  const states = {}; // entity_id -> état simulé, conservé quand on change le nombre de décodeurs
  const cards = [];

  function decoder(i) {
    const id = `media_player.decodeur_${i}`;
    if (!states[id]) {
      const now = new Date(Date.now() - 1200e3).toISOString();
      const src = START[(i - 1) % START.length];
      states[id] = {
        entity_id: id,
        state: veille ? "off" : "playing",
        attributes: {
          friendly_name: `Décodeur ${i}`,
          source_list: list, source: src,
          media_title: i === 1 ? "7. ARTE - Les routes de l'impossible" : src + " - Programme",
          media_series_title: i === 1 ? "Les routes de l'impossible" : null,
          media_season: i === 1 ? 2 : null, media_episode: i === 1 ? 5 : null,
          media_duration: 3000, media_position: 0, media_position_updated_at: now,
          entity_picture: "https://picsum.photos/seed/livebox" + (i === 1 ? "" : i) + "/800/450",
          media_content_type: "tvshow", is_volume_muted: false,
        },
      };
      states[`remote.decodeur_${i}`] = { entity_id: `remote.decodeur_${i}`, state: "on", attributes: {} };
    }
    return id;
  }

  const update = (id, patch, attrs) => {
    const st = states[id];
    states[id] = { ...st, ...patch, attributes: { ...st.attributes, ...attrs } };
    push();
  };
  const userData = {}; // simule frontend/get_user_data et set_user_data
  const hass = () => ({
    states: { ...states },
    callWS: async (msg) => {
      if (msg.type === "frontend/get_user_data") return { value: userData[msg.key] ?? null };
      if (msg.type === "frontend/set_user_data") {
        userData[msg.key] = msg.value;
        log(`user_data ${msg.key} ${JSON.stringify(msg.value)}`);
        return null;
      }
      throw new Error("unknown_command");
    },
    entities: Object.fromEntries(Object.keys(states).map((id) => [id, { device_id: "dev_" + id.split("_").pop(), platform: "liveboxtvuhd" }])),
    callService: async (d, s, data) => {
      log(`${d}.${s} ${JSON.stringify(data)}`);
      const id = data.entity_id;
      if (!states[id] || d !== "media_player") return;
      if (s === "select_source") {
        setTimeout(() => update(id, {}, { source: data.source, media_title: data.source + " - Journal", entity_picture: "https://picsum.photos/seed/" + encodeURIComponent(data.source) + "/800/450", media_series_title: null, media_season: null, media_episode: null, media_position: 0, media_position_updated_at: new Date().toISOString(), media_duration: 1800 }), 1500);
      }
      if (s === "media_play_pause") update(id, { state: states[id].state === "playing" ? "paused" : "playing" });
      if (s === "volume_mute") update(id, {}, { is_volume_muted: data.is_volume_muted });
      if (s === "turn_on" || s === "turn_off") update(id, { state: s === "turn_on" ? "playing" : "off" });
    },
  });
  function push() { const h = hass(); cards.forEach((c) => (c.hass = h)); }
  function toggleAll() {
    const ids = cards.map((c) => c._testEntity);
    const allOff = ids.every((id) => states[id].state === "off");
    ids.forEach((id) => (states[id] = { ...states[id], state: allOff ? "playing" : "off" }));
    push();
  }

  function render(n) {
    const box = document.getElementById("cards");
    // garde les cartes existantes, ajoute ou retire seulement la différence
    while (cards.length > n) cards.pop().parentElement.remove();
    for (let i = cards.length + 1; i <= n; i++) {
      const entity = decoder(i);
      const even = i % 2 === 0;
      const c = document.createElement("livebox-tv-card");
      // un décodeur sur deux en liste + télécommande, pour montrer les deux présentations
      c.setConfig(even
        ? { entity, channel_layout: "list", default_panel: "remote", show_artwork: false }
        : { entity, favorites: [1, 2, 6, "ARTE"], default_panel: "channels" });
      c._testEntity = entity;
      const col = document.createElement("div");
      col.className = "col";
      col.appendChild(c);
      box.appendChild(col);
      cards.push(c);
    }
    push();
  }

  const input = document.getElementById("count");
  const clamp = (v) => Math.min(MAX, Math.max(1, parseInt(v, 10) || 1));
  input.value = clamp(params.get("n") || (apercu !== null ? 2 : 1));
  input.addEventListener("change", () => {
    input.value = clamp(input.value);
    const u = new URL(location.href);
    if (+input.value === 1) u.searchParams.delete("n"); else u.searchParams.set("n", input.value);
    history.replaceState(null, "", u);
    render(+input.value);
  });
  customElements.whenDefined("livebox-tv-card").then(() => render(+input.value));
</script>
</body>
</html>
